<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 · 三国群雄传平台司令台</title>
  <link rel="stylesheet" href="/static/css/login.css" />
</head>
<body>
  <div class="login-shell">
    <div class="login-card">
      <div class="login-brand">
        <div class="seal">令</div>
        <h1>三国群雄传平台司令台</h1>
        <p>本地管理入口</p>
      </div>

      <div class="enter-panel">
        <p class="enter-desc">
          请先登录本机<strong>官方 PC 微信</strong>，再进入司令台配置定时群播报。
        </p>
        <button type="button" class="btn-confirm" id="btnLocalEnter">进入司令台</button>
        <div class="confirm-msg" id="localMsg"></div>
      </div>

      <div class="login-foot">
        保持微信已登录；发送时窗口可能被短暂置前。
      </div>
    </div>
  </div>

  <script src="/static/js/login.js"></script>
</body>
</html>
